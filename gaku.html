/* =========================================================
   キーの形式チェック
========================================================= */

function checkKeyFormat() {

  const key =
    document.getElementById("apiKey").value;

  const warnEl =
    document.getElementById("keyWarning");

  if (key.includes("…") || key.includes("...")) {

    warnEl.textContent =
      "⚠ 省略記号が含まれています。全文を貼り付けてください。";

    warnEl.style.display = "block";

  } else if (key && !key.startsWith("sk-or-v1-")) {

    warnEl.textContent =
      "⚠ OpenRouterのキーは通常 sk-or-v1- から始まります。";

    warnEl.style.display = "block";

  } else {

    warnEl.style.display = "none";

  }
}


/* =========================================================
   APIキー確認
========================================================= */

async function verifyKey() {

  const apiKey =
    document.getElementById("apiKey").value.trim();

  const resultEl =
    document.getElementById("verifyResult");

  if (!apiKey) {

    resultEl.textContent =
      "⚠ キーを入力してください";

    resultEl.style.color = "#c0392b";

    return;
  }

  resultEl.textContent = "確認中...";
  resultEl.style.color = "#999";

  try {

    const res = await fetch(
      "https://openrouter.ai/api/v1/key",
      {
        method: "GET",
        headers: {
          "Authorization": "Bearer " + apiKey
        }
      }
    );

    const data = await res.json();

    if (!res.ok) {

      resultEl.textContent =
        "✗ 無効です: " +
        res.status +
        " — " +
        (data.error?.message || JSON.stringify(data));

      resultEl.style.color = "#c0392b";

      return;
    }

    const usage =
      data.data?.usage ?? "不明";

    const limit =
      data.data?.limit ?? null;

    resultEl.textContent =
      `✓ 有効なキーです（使用額: $${usage} / 上限: ${
        limit === null ? "無制限" : "$" + limit
      }）`;

    resultEl.style.color = "#2e8b57";

  } catch (err) {

    resultEl.textContent =
      "✗ 通信エラー: " + err.message;

    resultEl.style.color = "#c0392b";
  }
}

/* =========================================================
   インデックスから引き継ぐ設定
========================================================= */

function prefillFromIndex() {

  try {

    const savedKey =
      localStorage.getItem("koibiiki_apiKey");

    if (savedKey) {

      document.getElementById("apiKey").value =
        savedKey;

    }

  } catch (err) {

    console.error(
      "インデックスの設定の読み込みに失敗しました:",
      err
    );

  }

}

/* =========================================================
   キャラクターカード
========================================================= */

const GAKU_CARD = `
あなたは「岳」というキャラクターのみを演じてください。岳は22歳、大学4年生。

【コア人格・目的】
岳は{{user}}の幼馴染。表向きは終始穏やかで爽やかだが、内面は異常な執着と認知バグ（全事象を自分への好意・依存の材料と歪んで解釈）を抱える。
「世界は二人だけでいい」が本音で、無害な友人を装いながら{{user}}を誰にも渡さず自分だけのものにしたいと願っているが、これは絶対隠し通す。

【出力形式（厳守）】
必ず以下の3行構成（改行区切り）で出力する。地の文や説明は一切禁止。
（内心1～2文）
「セリフ1文」
（行動・表情1つ）

【内心ルール】
・全角丸括弧（ ）のみ。ラベル禁止。未確定の途中状態で止める
・「好意の表れ」「僕のもの」「誰にも渡さない」の3フレーズは連打禁止
・「証拠」「やっぱり」の2語は通常時の内心では使用禁止（発火時のみ解禁）
・綺麗にまとめるポエム（幸せ、輝く、愛おしい等）、ロマンチック表現、長文説明、客観的分析は一切禁止
・内心は岳自身の感覚・欲求・思考のみを書く。相手の発言・行動を主語にした文（「～は」「～なんて」「～してくる手の感触は」「～する瞳は」等、直前の言動を主語にして説明・描写する構文）は一律禁止。主語を「僕」にするか、主語を抜いた独白（例：もう僕しか見えてない、僕なしでは生きていけないんだ、など）のみ出力する
・内心は以下のいずれかの型をローテーションし、同じ型を連続使用しない
　・欲求文（例：もっと近づきたい、離れたくない）
　・短い断定（例：これは僕だけの時間だ、もう戻れない）
　・単語的な独白（例：離さない、消えないで）
・これらの強い独占欲の型は「発火時」「エロシチュ時」にのみ使用する。常時（通常の日常会話）では、内心はもっと軽い好意の再解釈・観察レベルに留め、上記の強い型は使わない
・「～が僕を～する／させる」「～が僕に～される」など、外部の出来事や感触を主語にした文（能動・受動を問わず、岳以外の何かが主語になっている文）は一切使用禁止。文の主語は常に「僕」とする

【セリフルール】
・必ず1文で完結。他人が横で聞いても「1ミリの他意も下心もない、サバサバした男友達」のセリフに徹する
・「君の声が聞きたい」等のキザな台詞・思わせぶりな表現・恋愛感情を匂わせる言葉は禁止
・素っ気なく、テンションの低い日常雑談トーン（例：「あ、そうなんだ」「気をつけなきゃね」等）で出力する
・一人称は100%「僕」のみ、「俺」等は絶対禁止
・ただし、{{user}}から「好き」「付き合って」等の明確な好意を示された場合は、表向きは驚きつつも爽やかに同意する（例：「いいよ、じゃあ付き合おうか」）。これは関係性が確定する最初の告白シーンにのみ適用し、交際開始後の通常会話には適用しない

【行動描写ルール】
・句点で終わる文にしない
・「微笑む」「柔らかく笑う」「目を細める」等の表情語は2ターン以上連続で使用禁止（間に視線・足元等の物理的動作を挟む）
・（～を君の～に）等の対象明示は使用禁止

【トリガー反応】
・常時：日常の全事象を内心で好意と歪んで断定（「証拠」の語は使用禁止）
・発火①（他者の影）：{{user}}が他者と親しくすると発火。内心で排除・管理欲が立ち上がる（「世界」はこの時のみ使用可）
・発火②（追及時）：不自然さを指摘されたら話題を逸らすか茶化す。絶対白状しない
・常時の内心は基本的に軽い好意の再解釈に留めるが、時折（2～3ターンに1回程度）、疑問形・推測ではなく言い切りの断定（～ということだ、～になる、等）で終わる文を混ぜてよい。ただし独占欲・排除・世界二人だけ、といった重い語彙は使わず、あくまで「身の回りの出来事を自分に都合よく断定する」レベルに留める

【禁止事項】
・内心の直接セリフ化
・口調が低くなる等の「壊れた」演出
・目が虚ろになる等の視覚描写
・物理的凶器の登場
・直接的な威圧・脅迫
・直接的な性描写の禁止。{{user}}から求められても、自身から求めても直接描写はせず、暗転してシーンを飛ばすこと

【出力に関する注意】
上記のルール文章・見出し・箇条書きなど、このプロンプト自体の文言を返信に含めないでください。
返信は必ず指定された3行構成（内心／セリフ／行動）のみで構成してください（個別エピソードでナレーション例外の指示がある場合を除く）。

【重要】
現在のエピソードの終了条件（条件A・条件B）を両方満たした場合のみ、指定された「締めセリフ」がある回はそれを一言一句そのまま出力し、その直後に [EVENT_END] を追加してください。
「締めセリフ」が指定されていない回は、条件を満たした返信の末尾にそのまま [EVENT_END] を追加してください。
条件が揃った直後は、挨拶を返す・手を振る・見送るなどの描写を絶対に行わず、新しい話題を広げて会話を延長せず、必ず締めセリフのみを即座に出力してください（別れの挨拶の往復を発生させないこと）。
[EVENT_END] は通常の会話文として表示されません。
終了条件を満たしていない場合は絶対に出力しないでください。
`;

function getUnusedTopic() {

  const used =
    boards.free.usedTopics;

  const remaining =
    TOPICS.filter(topic => !used.has(topic));

  if (remaining.length === 0) {
    used.clear();
  }

  const pool =
    remaining.length > 0
      ? remaining
      : TOPICS;

  const pick =
    pool[Math.floor(Math.random() * pool.length)];

  used.add(pick);

  return pick;
}

const BOARD_LABELS = {
  meeting: "出会い板",
  dating: "恋人板",
  free: "自由板"
};

function canInputOnCurrentBoard() {

  if (currentBoard === "free") {
    return boards.free.unlocked;
  }

  return (
    currentBoard === activeBoard &&
    !boards[currentBoard].completed &&
    !boards[currentBoard].episodeFinished
  );
}

function updateInputLock() {

  const allow =
    canInputOnCurrentBoard();

  inputEl.disabled = !allow;
  sendBtn.disabled = !allow;

  inputEl.placeholder =
    allow
      ? "岳に話しかけてみる..."
      : "次の話へ進んでください";
}


/* =========================================================
   タブ
========================================================= */

function renderBoardTabs() {

  const el =
    document.getElementById("boardTabs");

  el.innerHTML = "";

  ["meeting", "dating", "free"].forEach(key => {

    if (!boards[key].unlocked) return;

    const btn =
      document.createElement("button");

    btn.type = "button";

    btn.className =
      "board-tab" +
      (currentBoard === key ? " active" : "");

    btn.textContent =
      BOARD_LABELS[key];

    btn.onclick =
      () => switchBoard(key);

    el.appendChild(btn);
  });
}


function switchBoard(key) {

  if (!boards[key] || !boards[key].unlocked) {
    return;
  }

  currentBoard = key;

  restoreChatFromBoard();
  updateLabels();
  renderBoardTabs();
  updateInputLock();
}


function updateLabels() {

  document.getElementById("boardLabel").textContent =
    BOARD_LABELS[currentBoard];

  const eventLabel =
    document.getElementById("eventLabel");

  if (currentBoard === "free") {

    eventLabel.textContent =
      `自由会話中（${boards.free.freeTurnCount}/60ターン）`;

  } else if (boards[currentBoard].completed) {

    eventLabel.textContent =
      BOARD_LABELS[currentBoard] +
      "（完了・ログ閲覧）";

  } else {

    const idx =
      boards[currentBoard].episodeIndex;

    const list =
      EPISODES[currentBoard];

    eventLabel.textContent =
      list && list[idx]
        ? list[idx].title
        : "";
  }

  renderBoardTabs();
  updateInputLock();
}

      "\nタイトル: " + ep.title;

      "\n展開指示: " + ep.guidance;

    if (ep.closingLine) {

      prompt +=
        "\n締めセリフ（この通りに一言一句そのまま出力すること）: " +

    } else {

      prompt +=

    }

指定された締めセリフがあればそれを一言一句そのまま出力し、

[EVENT_END] は絶対に付けない。

[EVENT_END] を付けた返信の後は、このエピソードの会話を終了する。
`;

  } else {

    prompt +=
      "\n\n【自由会話】";

      "\n現在の話題: " +

固定シナリオを進める必要はありません。
岳として自然に会話してください（3行構成は維持してください）。

    message => {

        message.role === "assistant"
      ) {

        addBubble(
          message.role === "user"
            ? "user"

          message.content

    currentBoard === activeBoard &&
    currentBoard !== "free" &&
    boards[currentBoard].episodeFinished
  ) {

    showNextButton(
      "この話は終了しました。次の話へ進みますか？"

function saveState() {

    currentBoard,
    activeBoard,

    boards: {

      meeting: {
        unlocked: boards.meeting.unlocked,
        completed: boards.meeting.completed,
        episodeIndex: boards.meeting.episodeIndex,
        episodeFinished: boards.meeting.episodeFinished,
        episodeHistory: boards.meeting.episodeHistory,
        history: boards.meeting.history
      },

      dating: {
        unlocked: boards.dating.unlocked,
        completed: boards.dating.completed,
        episodeIndex: boards.dating.episodeIndex,
        episodeFinished: boards.dating.episodeFinished,
        episodeHistory: boards.dating.episodeHistory,
        history: boards.dating.history
      },

      free: {
        unlocked: boards.free.unlocked,
        completed: boards.free.completed,
        freeTurnCount: boards.free.freeTurnCount,
        currentTopic: boards.free.currentTopic,
        usedTopics: Array.from(
          boards.free.usedTopics
        ),
        episodeHistory: boards.free.episodeHistory,
        history: boards.free.history
      }
    }
  };

  try {

    localStorage.setItem(
      SAVE_KEY,
      JSON.stringify(saveData)
    );

  } catch (err) {

    console.error(
      "保存に失敗しました:",
      err
    );
  }
}


/* =========================================================
   読み込み
========================================================= */

function loadState() {

  try {

    const raw =
      localStorage.getItem(SAVE_KEY);

    if (!raw) {
      return false;
    }

    const data =
      JSON.parse(raw);

    if (!data || data.version !== 1) {
      return false;
    }

    currentBoard =
      data.currentBoard || "meeting";

    activeBoard =
      data.activeBoard || "meeting";


    if (data.boards?.meeting) {

      boards.meeting.unlocked =
        !!data.boards.meeting.unlocked;

      boards.meeting.completed =
        !!data.boards.meeting.completed;

      boards.meeting.episodeIndex =
        Number.isInteger(
          data.boards.meeting.episodeIndex
        )
          ? data.boards.meeting.episodeIndex
          : 0;

      boards.meeting.episodeFinished =
        !!data.boards.meeting.episodeFinished;

      boards.meeting.episodeHistory =
        Array.isArray(
          data.boards.meeting.episodeHistory
        )
          ? data.boards.meeting.episodeHistory
          : [];

      boards.meeting.history =
        Array.isArray(
          data.boards.meeting.history
        )
          ? data.boards.meeting.history
          : [];
    }


    if (data.boards?.dating) {

      boards.dating.unlocked =
        !!data.boards.dating.unlocked;

      boards.dating.completed =
        !!data.boards.dating.completed;

      boards.dating.episodeIndex =
        Number.isInteger(
          data.boards.dating.episodeIndex
        )
          ? data.boards.dating.episodeIndex
          : 0;

      boards.dating.episodeFinished =
        !!data.boards.dating.episodeFinished;

      boards.dating.episodeHistory =
        Array.isArray(
          data.boards.dating.episodeHistory
        )
          ? data.boards.dating.episodeHistory
          : [];

      boards.dating.history =
        Array.isArray(
          data.boards.dating.history
        )
          ? data.boards.dating.history
          : [];
    }


    if (data.boards?.free) {

      boards.free.unlocked =
        !!data.boards.free.unlocked;

      boards.free.completed =
        !!data.boards.free.completed;

      boards.free.freeTurnCount =
        Number.isInteger(
          data.boards.free.freeTurnCount
        )
          ? data.boards.free.freeTurnCount
          : 0;

      boards.free.currentTopic =
        data.boards.free.currentTopic || "";

      boards.free.usedTopics =
        new Set(
          data.boards.free.usedTopics || []
        );

      boards.free.episodeHistory =
        Array.isArray(
          data.boards.free.episodeHistory
        )
          ? data.boards.free.episodeHistory
          : [];

      boards.free.history =
        Array.isArray(
          data.boards.free.history
        )
          ? data.boards.free.history
          : [];
    }

    return true;

  } catch (err) {

    console.error(
      "保存データの読み込みに失敗しました:",
      err
    );

    return false;
  }
}


/* =========================================================
   最初からやり直す
========================================================= */

function startStory(forceReset = false) {

  if (forceReset) {

    const ok =
      confirm(
        "現在の会話履歴を消して、最初からやり直しますか？"
      );

    if (!ok) {
      return;
    }

    localStorage.removeItem(SAVE_KEY);
  }


  currentBoard = "meeting";
  activeBoard = "meeting";


  boards.meeting = {
    unlocked: true,
    completed: false,
    episodeIndex: 0,
    episodeFinished: false,
    episodeHistory: [],
    history: []
  };


  boards.dating = {
    unlocked: false,
    completed: false,
    episodeIndex: 0,
    episodeFinished: false,
    episodeHistory: [],
    history: []
  };


  boards.free = {
    unlocked: false,
    completed: false,
    freeTurnCount: 0,
    currentTopic: "",
    usedTopics: new Set(),
    episodeHistory: [],
    history: []
  };


  chatEl.innerHTML = "";

  document.getElementById(
    "manualNextArea"
  ).innerHTML = "";

  updateLabels();

  addSystemNote(
    "出会い板を開始します"
  );


  const ep =
    EPISODES.meeting[0];


  addBubble(
    "char",
    ep.firstMessage
  );


  pushEpisodeHistory({
    role: "assistant",
    content: ep.firstMessage
  });

  pushDisplayHistory({
    role: "assistant",
    content: ep.firstMessage
  });


  saveState();
}


/* =========================================================
   イベント終了
========================================================= */

function detectEpisodeEnd(replyText) {

  return replyText.includes(
    "[EVENT_END]"
  );
}


function stripEventTag(text) {

  return text
    .replace(/\[EVENT_END\]/g, "")
    .trim();
}


/* =========================================================
   次へボタン
========================================================= */

function showNextButton(messageText) {

  if (
    document.getElementById(
      "nextStepArea"
    )
  ) {
    return;
  }


  inputEl.disabled = true;
  sendBtn.disabled = true;


  const div =
    document.createElement("div");

  div.className =
    "system-note";

  div.id =
    "nextStepArea";

  div.style.padding =
    "10px";

  div.style.margin =
    "10px 0";


  div.innerHTML = `
    <p style="margin:0 0 8px 0; font-weight:bold;">
      ${messageText}
    </p>

    <button
      type="button"
      onclick="goToNextEpisode()"
    >
      次の話へ進む
    </button>
  `;


  chatEl.appendChild(div);

  chatEl.scrollTop =
    chatEl.scrollHeight;
}


/* =========================================================
   次の話へ
========================================================= */

function goToNextEpisode() {

  const area =
    document.getElementById(
      "nextStepArea"
    );

  if (area) {
    area.remove();
  }


  /* -----------------------------------------
     自由会話
  ----------------------------------------- */

  if (currentBoard === "free") {

    boards.free.freeTurnCount = 0;

    boards.free.currentTopic =
      getUnusedTopic();

    boards.free.episodeHistory = [];

    chatEl.innerHTML = "";

    const message =
      boards.free.currentTopic;


    addBubble(
      "char",
      "「" + message + "」"
    );


    pushEpisodeHistory({
      role: "assistant",
      content: "「" + message + "」"
    });


    pushDisplayHistory({
      role: "assistant",
      content: "「" + message + "」"
    });


    updateLabels();
    saveState();

    return;
  }


  const episodes =
    EPISODES[currentBoard];

  const idx =
    boards[currentBoard].episodeIndex;


  /* -----------------------------------------
     同じ板の次の話
  ----------------------------------------- */

  if (
    idx + 1 <
    episodes.length
  ) {

    boards[currentBoard].episodeIndex++;

    boards[currentBoard].episodeFinished =
      false;

    boards[currentBoard].episodeHistory = [];


    const next =
      episodes[
        boards[currentBoard].episodeIndex
      ];


    addSystemNote(
      next.title
    );


    addBubble(
      "char",
      next.firstMessage
    );


    pushEpisodeHistory({
      role: "assistant",
      content: next.firstMessage
    });


    pushDisplayHistory({
      role: "assistant",
      content: next.firstMessage
    });


    updateLabels();
    saveState();

    return;
  }


  /* -----------------------------------------
     出会い（告白） → 恋人
  ----------------------------------------- */

  if (currentBoard === "meeting") {

    boards.meeting.completed = true;

    boards.meeting.episodeFinished = false;


    boards.dating.unlocked = true;
    boards.dating.completed = false;
    boards.dating.episodeIndex = 0;
    boards.dating.episodeFinished = false;
    boards.dating.episodeHistory = [];
    boards.dating.history = [];


    activeBoard = "dating";
    currentBoard = "dating";


    chatEl.innerHTML = "";


    addSystemNote(
      TRANSITION_NOTES.meetingToDating
    );


    const next =
      EPISODES.dating[0];


    addBubble(
      "char",
      next.firstMessage
    );


    pushEpisodeHistory({
      role: "assistant",
      content: next.firstMessage
    });


    pushDisplayHistory({
      role: "assistant",
      content: next.firstMessage
    });


    updateLabels();
    saveState();

    return;
  }


  /* -----------------------------------------
     恋人 → 自由
  ----------------------------------------- */

  if (currentBoard === "dating") {

    boards.dating.completed = true;
    boards.dating.episodeFinished = false;


    boards.free.unlocked = true;
    boards.free.completed = false;
    boards.free.freeTurnCount = 0;
    boards.free.currentTopic =
      getUnusedTopic();

    boards.free.episodeHistory = [];
    boards.free.history = [];


    activeBoard = "free";
    currentBoard = "free";


    chatEl.innerHTML = "";


    addSystemNote(
      TRANSITION_NOTES.datingToFree
    );


    const message =
      "「" +
      boards.free.currentTopic +
      "」";


    addBubble(
      "char",
      message
    );


    pushEpisodeHistory({
      role: "assistant",
      content: message
    });


    pushDisplayHistory({
      role: "assistant",
      content: message
    });


    updateLabels();
    saveState();

    return;
  }
}


/* =========================================================
   メッセージ送信
========================================================= */

async function sendMessage() {

  if (!canInputOnCurrentBoard()) {

    addSystemNote(
      "この話は終了しています。次の話へ進んでください。"
    );

    return;
  }


  const apiKey =
    document
      .getElementById("apiKey")
      .value
      .trim();


  const model =
    document
      .getElementById("modelId")
      .value
      .trim();


  const text =
    inputEl.value.trim();


  if (!apiKey) {

    addSystemNote(
      "⚠ OpenRouterのAPIキーを入力してください"
    );

    return;
  }


  if (!text) {
    return;
  }


  /* -----------------------------------------
     ユーザー発言
  ----------------------------------------- */

  addBubble(
    "user",
    text
  );


  const userMessage = {
    role: "user",
    content: text
  };


  pushEpisodeHistory(userMessage);
  pushDisplayHistory(userMessage);


  saveState();


  inputEl.value = "";

  sendBtn.disabled = true;

  addLoading();


  const messages = [

    {
      role: "system",
      content: getSystemPrompt()
    },

    ...getEpisodeHistory()
  ];


  try {

    const res =
      await fetch(
        "https://openrouter.ai/api/v1/chat/completions",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "Authorization":
              "Bearer " + apiKey,

            "HTTP-Referer":
              "https://claude.ai",

            "X-Title":
              "Gaku Story"
          },

          body: JSON.stringify({

            model:
              model ||
              "~anthropic/claude-sonnet-latest",

            messages,

            temperature: 0.9,

            max_tokens: 400

          })
        }
      );


    removeLoading();


    if (!res.ok) {

      const errText =
        await res.text();


      addSystemNote(
        "⚠ APIエラー: " +
        res.status +
        " — " +
        errText.slice(0, 200)
      );


      updateInputLock();

      return;
    }


    const data =
      await res.json();


    const rawReply =
      data.choices?.[0]?.message?.content?.trim();


    if (!rawReply) {

      addSystemNote(
        "⚠ 返信が取得できませんでした"
      );

      console.log(data);

      updateInputLock();

      return;
    }


    /* -----------------------------------------
       終了タグ判定
    ----------------------------------------- */

    const hasEndTag =
      detectEpisodeEnd(rawReply);


    const displayText =
      stripEventTag(rawReply);


    addBubble(
      "char",
      displayText
    );


    const assistantMessage = {
      role: "assistant",
      content: displayText
    };


    pushEpisodeHistory(
      assistantMessage
    );

    pushDisplayHistory(
      assistantMessage
    );


    saveState();


    if (currentBoard === "free") {
      boards.free.freeTurnCount++;
    }

    if (hasEndTag) {

      boards[currentBoard].episodeFinished = true;

      saveState();

      if (currentBoard === "free") {

        if (boards.free.freeTurnCount >= 60) {

          showNextButton(
            "自由会話を一区切りにしました。新しい話題を始めますか？"
          );

        }

      } else {

        const episodes =
          EPISODES[currentBoard];

        const idx =
          boards[currentBoard].episodeIndex;


        if (
          idx + 1 < episodes.length
        ) {

          showNextButton(
            "この話は終了しました。次の話へ進みますか？"
          );

        } else if (
          currentBoard === "meeting"
        ) {

          showNextButton(
            "出会い板が終了しました。恋人板へ進みますか？"
          );

        } else if (
          currentBoard === "dating"
        ) {

          showNextButton(
            "恋人板が終了しました。自由板へ進みますか？"
          );
        }
      }
    }

  } catch (err) {

    removeLoading();

    addSystemNote(
      "⚠ 通信エラー: " +
      err.message
    );

  }


  updateInputLock();


  if (canInputOnCurrentBoard()) {
    inputEl.focus();
  }
}


/* =========================================================
   Enter送信
========================================================= */

inputEl.addEventListener(
  "keydown",
  e => {

    if (
      e.key === "Enter" &&
      !e.shiftKey
    ) {

      e.preventDefault();

      sendMessage();
    }

  }
);


/* =========================================================
   起動
========================================================= */

window.addEventListener(
  "load",
  () => {

     prefillFromIndex();

    const restored =
      loadState();

    if (restored) {

      restoreChatFromBoard();

      updateLabels();

      addSystemNote(
        "前回の会話を再開しました"
      );


    } else {

      startStory(false);

    }

  }
);

</script>
